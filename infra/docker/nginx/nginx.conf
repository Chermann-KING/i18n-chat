# =============================================================================
# infra/docker/nginx/nginx.conf
# Nginx reverse proxy — TLS termination + routing for on-premise deployment.
#
# Upstream services (resolved by Docker DNS inside compose network):
#   api  → http://api:3001   (NestJS)
#   web  → http://web:3000   (Next.js)
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ────────────────────────────────────────────────────────────────
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  gzip  on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;

  # ─── Rate limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  # ─── Upstreams ────────────────────────────────────────────────────────────
  upstream api_backend {
    server api:3001;
    keepalive 32;
  }

  upstream web_backend {
    server web:3000;
    keepalive 32;
  }

  # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ─── HTTPS ────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options          DENY        always;
    add_header X-Content-Type-Options   nosniff     always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # ── API routes ─────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # ── WhatsApp webhook (no rate limit — Meta IP range) ──────────────────
    location /webhooks/ {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js static assets (long-lived cache) ───────────────────────────
    location /_next/static/ {
      proxy_pass         http://web_backend;
      proxy_cache_valid  200 365d;
      add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js app ────────────────────────────────────────────────────────
    location / {
      proxy_pass         http://web_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
