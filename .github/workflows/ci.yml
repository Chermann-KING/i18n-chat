name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/i18n-chat-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/i18n-chat-web
  NODE_VERSION: "22"
  PNPM_VERSION: "10.31.0"

jobs:

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (includes prisma generate)
        run: pnpm turbo build --filter=!@i18n-chat/api --filter=!@i18n-chat/web

      - name: Run lint
        run: pnpm lint

  # ─── Type-check ───────────────────────────────────────────────────────────
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (includes prisma generate)
        run: pnpm turbo build --filter=!@i18n-chat/api --filter=!@i18n-chat/web

      - name: Run type-check
        run: pnpm type-check

  # ─── Test ─────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (includes prisma generate)
        run: pnpm turbo build --filter=!@i18n-chat/api --filter=!@i18n-chat/web

      - name: Run tests with coverage
        run: pnpm test -- --coverage --passWithNoTests
        env:
          # Minimal env so NestJS ConfigService doesn't throw at test bootstrap
          DATABASE_URL:      postgresql://test:test@localhost:5432/test
          REDIS_URL:         redis://localhost:6379
          JWT_SECRET:        ci-jwt-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-min!!
          ENCRYPTION_KEY:    aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage/
          retention-days: 7

  # ─── Build Docker images ──────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    permissions:
      contents: read
      packages: write
    # Build on every push — push to registry only on main
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image names (GHCR requires lowercase)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_API=ghcr.io/${OWNER}/i18n-chat-api" >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${OWNER}/i18n-chat-web" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_API }}
            ${{ env.IMAGE_WEB }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ────────────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_API }}:sha-${{ github.sha }}
            ${{ env.IMAGE_API }}:${{ github.ref_name }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_API) || '' }}
          cache-from: type=gha,scope=api
          cache-to:   type=gha,mode=max,scope=api
          platforms: linux/amd64

      # ── Web image ────────────────────────────────────────────────────────
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_WEB }}:sha-${{ github.sha }}
            ${{ env.IMAGE_WEB }}:${{ github.ref_name }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE_WEB) || '' }}
          cache-from: type=gha,scope=web
          cache-to:   type=gha,mode=max,scope=web
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
